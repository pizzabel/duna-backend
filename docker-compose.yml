# D-una · Docker Compose para desarrollo local
# Levanta PostgreSQL 16 con PostGIS y Redis con un solo comando:
#   docker compose up -d

services:

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: duna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     duna
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       duna_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Ejecuta la migración PostGIS al primer arranque
      - ./prisma/postgis-migration.sql:/docker-entrypoint-initdb.d/01-postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duna -d duna_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: duna-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
